<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            position: relative;
            cursor: pointer;
        }
        
        .contenedor {
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        .titulo {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: aparecerTitulo 2s ease-out;
        }
        
        @keyframes aparecerTitulo {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .subtitulo {
            color: #E8E8E8;
            font-size: 1.5em;
            font-style: italic;
            margin-bottom: 30px;
            animation: aparecerTitulo 2s ease-out 0.5s backwards;
        }
        
        .boton-flores {
            background-color: #FFD700;
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            animation: aparecerTitulo 2s ease-out 1s backwards;
        }
        
        .boton-flores:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 35px rgba(255, 215, 0, 0.6);
        }
        
        /* Flores que aparecen */
        .flor {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            animation: florecer 2s ease-out forwards;
        }
        
        @keyframes florecer {
            0% { 
                transform: scale(0) rotate(0deg); 
                opacity: 0; 
            }
            50% { 
                transform: scale(1.5) rotate(180deg); 
                opacity: 1; 
            }
            100% { 
                transform: scale(1) rotate(360deg); 
                opacity: 0;
            }
        }
        
        /* Flor estática que se queda */
        .flor-permanente {
            position: fixed;
            pointer-events: none;
            z-index: 4;
            font-size: 2em;
            animation: flotarSuave 4s ease-in-out infinite;
        }
        
        @keyframes flotarSuave {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(5deg); }
            50% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-30px) rotate(3deg); }
        }
        
        .boton-volver {
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            padding: 12px 30px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .boton-volver:hover {
            background-color: rgba(255, 215, 0, 0.1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1 class="titulo">🌻 Flores Amarillas para Ti</h1>
        <p class="subtitulo">Haz clic en cualquier lugar para hacer florecer...</p>
        <button class="boton-flores" onclick="hacerFlorecer(event)">🌼 Hacer Florecer</button>
        <br><br>
        <button class="boton-volver" onclick="window.location.href='index.html'">💛 Volver</button>
    </div>

    <script>
        // ==========================================
        // FLORES QUE APARECEN AL HACER CLIC
        // ==========================================
        const floresEmojis = ['🌻', '🌼', '💛', '🌻', '🌼', '✨'];
        
        function hacerFlorecer(event) {
            // Evitar que el clic en el botón haga doble acción
            event.stopPropagation();
            
            // Crear 5 flores
            for (let i = 0; i < 5; i++) {
                crearFlor(event.clientX, event.clientY);
            }
            
            // Crear flores aleatorias en toda la pantalla
            for (let i = 0; i < 10; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                setTimeout(function() {
                    crearFlor(x, y);
                }, i * 200);
            }
        }
        
        function crearFlor(x, y) {
            const flor = document.createElement('div');
            flor.className = 'flor';
            flor.textContent = floresEmojis[Math.floor(Math.random() * floresEmojis.length)];
            flor.style.left = (x + (Math.random() * 60 - 30)) + 'px';
            flor.style.top = (y + (Math.random() * 60 - 30)) + 'px';
            flor.style.fontSize = (Math.random() * 1.5 + 2) + 'em';
            document.body.appendChild(flor);
            
            // Eliminar la flor después de la animación
            setTimeout(function() {
                flor.remove();
            }, 2000);
            
            // Crear una flor permanente
            const florPermanente = document.createElement('div');
            florPermanente.className = 'flor-permanente';
            florPermanente.textContent = '🌻';
            florPermanente.style.left = (Math.random() * window.innerWidth) + 'px';
            florPermanente.style.top = (Math.random() * window.innerHeight) + 'px';
            florPermanente.style.opacity = '0.6';
            document.body.appendChild(florPermanente);
            
            // La flor permanente se queda
            setTimeout(function() {
                florPermanente.style.opacity = '0';
                florPermanente.style.transition = 'opacity 2s ease';
                setTimeout(function() {
                    florPermanente.remove();
                }, 2000);
            }, 5000);
        }
        
        // Hacer florecer al hacer clic en cualquier parte
        document.body.addEventListener('click', hacerFlorecer);
    </script>
</body>
</html>
